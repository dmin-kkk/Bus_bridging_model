# Coincidental matches reported by scripts/audit_package.py: a token in code equals a
# network identifier of the paper inputs but means something else. Each rule names the
# token, optionally the token kind (name/string/comment) and a context regex.

[[allow]]
token = "EPS"
kind = "name"
reason = "EPS is a numerical tolerance (epsilon) constant"

[[allow]]
token = "PAM"
context = "PAM( |-)?(근사|swap|approx|k-medoids)|Partitioning Around Medoids|PAM swap"
reason = "PAM = Partitioning Around Medoids (k-medoids algorithm)"
