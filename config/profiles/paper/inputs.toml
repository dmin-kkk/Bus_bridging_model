[inputs]
timetable = "train_schedule_20190801.csv"  # file name of the train timetable
od_matrix = "hourly_estimated_od_matrix.csv"  # file name of the hourly OD matrix
road_times = "Station_Distance_Matrix.csv"  # file name of the road travel-time matrix between stations
rail_travel_times = "Combined_TravelTime_All_Lines.csv"  # file name of the rail travel-time table
stations = "VLine_Stations_By_Line_U_dis_ex_melb.xlsx"  # file name of the station list by line
corridors = "SAME_CORRIDOR.csv"  # file name of the station-to-corridor table
