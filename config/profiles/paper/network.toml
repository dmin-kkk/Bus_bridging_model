[network]
central_group_id = "CENTRAL_SHARED"  # Sec. 5 (corridor grouping of Fig. 7/9): stations shared by corridors
central_group_label = "Central"  # figure label of the shared-station group
central_min_corridors = 2  # minimum number of corridors a station must serve to join the shared group
# stations expected in the shared group (consistency check)
central_shared_expected = ["ARR", "DEK", "FSY", "SPE", "SUE"]
max_transfers = 3  # maximum number of transfers in a passenger path
# Table 3 / Assumption 4: sigma is a constant 2 min; the per-station file inputs.walking_times
# must agree with operations.walking_transfer_min when this is true.
uniform_transfer_time = true  # use the constant transfer time sigma for every station
