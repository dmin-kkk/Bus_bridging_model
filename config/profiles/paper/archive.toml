[archive]
bootstrap_seed = 42  # random seed of the bootstrap confidence intervals
bootstrap_repetitions = 3000  # number of bootstrap resamples for the archive statistics
figure_dpi = 300  # resolution of the regenerated PNG figures
top_stations = 10  # Fig. 8c: top-10 stations (lowest mean disruption RI)
benchmark_labels = ["Proposed strategy", "Fixed centralized strategy"]  # Fig. 9 legend
corridor_order = []  # Fig. 8a/b axis order: corridors labelled from their ids
corridor_labels = []  # display labels of the corridors (empty = derive from corridor ids)
oof_policy_order = ["Wrong information", "Historical", "LightGBM", "Perfect information"]  # Fig. 11a/b, Sec. 5.6
scaling_window = 17  # Table 8: 17:00 planning window
scaling_depots = []  # Table 8: every depot with a positive target
relocation_window_gap_min = 60  # Sec. 5.2: transitions between consecutive hourly targets
source_root_marker = "busbridging"  # folder name that marks the project root when resolving source paths
oof_cases = []  # Table 7: incident descriptors of the out-of-fold cases
table4_depot_groups = []  # Table 4 row grouping: depots listed alphabetically

# Figs. 12-13 (Sec. 5.7): panel caption, x-axis label, tick labels and the sensitivity case id of each
# setting (case ids as written by Sensitivity/source/run_sensitivity.py; BASELINE = proposed run).
# caption, x-axis label, tick labels and case ids of each sensitivity panel
sensitivity_panels = [
  { caption = "(a) Incident type", xlabel = "Incident type", labels = ["Rolling\nStock", "Excess\nLoading", "Infra-\nstructure", "Path\nConflict", "Obstruction\non/near\nTrack"], cases = ["S2_TYPE_ROLLING", "S2_TYPE_EXCESS", "BASELINE", "S2_TYPE_TIMETABLE", "S2_TYPE_OBSTRUCTION"] },
  { caption = "(b) Minimum trip boarding", xlabel = "Minimum trip boarding", labels = ["1", "5", "10"], cases = ["BASELINE", "S2_MTB05", "S2_MTB10"] },
  { caption = "(c) Travel time scaling", xlabel = "Travel time scaling", labels = ["-20%", "-10%", "0%", "+10%", "+20%"], cases = ["S2_TTM20", "S2_TTM10", "BASELINE", "S2_TTP10", "S2_TTP20"] },
  { caption = "(d) Fleet size", xlabel = "Number of buses", labels = ["10", "20", "30", "40", "50"], cases = ["S2_BUS10", "S2_BUS20", "BASELINE", "S2_BUS40", "S2_BUS50"] },
  { caption = "(e) Express route pool", xlabel = "Stops per EXP route", labels = ["3", "3–5", "3–7"], cases = ["S2_ROUTE_K3", "BASELINE", "S2_ROUTE_K7"] },
  { caption = "(f) Out-of-vehicle time weight", xlabel = "Out-of-vehicle time weight", labels = ["1.0", "1.5", "2.0"], cases = ["BASELINE", "S2_QW150", "S2_QW200"] },
]

# Fig. 10a/b (Sec. 5.5): support case (empty station = skipped)
[archive.ap_case]
station = ""  # station of the passenger-support case study (empty = skip the case figures)
window = 17  # planning window of the support case
benchmark = "stage2_benchmark"  # paths key of the comparison Stage 2 run in the support case
benchmark_label = "Bus bridging (benchmark)"  # legend label of the comparison run in the support case
proposed_label = "Bus bridging (proposed)"  # legend label of the proposed run in the support case

