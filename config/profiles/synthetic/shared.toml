[probability]
# synthetic cohort: 150 incidents, 105 cleared within 30 min, 45 longer (by construction
# in scripts/make_synthetic_inputs.py; checked against the data at run time).
duration_counts = { "30" = 105, "60" = 45 }  # incident counts per duration state defining pi_30 and pi_60
duration_source = "operational303"  # cohort used for the duration prior
station_smoothing_beta = 0.5  # location smoothing parameter beta
duration_cutoff_min = 30  # cutoff in minutes between short and long duration classes
cutoff_alternatives_min = [30, 35, 40]  # alternative cutoffs evaluated for the duration classifier
long_counts_404 = { "30" = 45, "35" = 45, "40" = 45 }  # long-class sizes per cutoff in the full incident set

[clustering]
method = "K-means"  # representative-location clustering method
k_per_window = 4  # number of representative locations K per planning window (4 representative locations per window)

[scenarios]
logic_version = "causal_cancel_start_v4_hourly_od_gt1_20260821"  # version tag of the scenario construction logic

[routes]
library_file = "BusRoutes_LOC2_EXP_K3-5_T120.csv"  # file name of the route library
