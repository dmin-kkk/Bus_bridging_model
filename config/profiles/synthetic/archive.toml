[archive]
bootstrap_seed = 42  # random seed of the bootstrap confidence intervals
bootstrap_repetitions = 3000  # number of bootstrap resamples for the archive statistics
figure_dpi = 150  # resolution of the regenerated PNG figures (smaller PNGs)
top_stations = 10  # number of stations shown in the top-station ranking
# legend labels of the proposed and fixed centralized strategies
benchmark_labels = ["Proposed strategy", "Fixed centralized strategy"]
# axis order of the corridor panels (empty = corridors labelled from their ids)
corridor_order = []
corridor_labels = []  # display labels of the corridors (empty = derive from corridor ids)
# order of the information settings in the out-of-fold figures
oof_policy_order = ["Wrong information", "Historical", "LightGBM", "Perfect information"]
scaling_window = 17  # planning window shown in the Stage 1 scaling table
# depot columns of the scaling table (empty = every depot with a positive target)
scaling_depots = []
relocation_window_gap_min = 60  # minutes between consecutive hourly targets in the relocation statistics
source_root_marker = "busbridging"  # folder name that marks the project root when resolving source paths
# depot grouping of the allocation table (empty = depots listed alphabetically)
table4_depot_groups = []

# Table 7: two out-of-fold cases (long realized duration; one evening case, one central-station case).
# Each descriptor triple must match exactly one incident of the OOF cohort.
# incident descriptors (station, hour, state, label) of the out-of-fold case table
oof_cases = [
  { station = "AA5", hour = 17, state = 60, label = "AA5 incident at 17:00 (long duration)" },
  { station = "HUB", hour = 8, state = 60, label = "HUB incident at 08:00 (long duration)" },
]

# Figs. 12-13 (Sec. 5.7): panel caption, x-axis label, tick labels and the sensitivity case id of each
# setting; one variant of evaluation.sensitivity.cases per axis, baseline fleet 6, minimum boarding 1, express stops 3-5, weight 1.0.
# caption, x-axis label, tick labels and case ids of each sensitivity panel
sensitivity_panels = [
  { caption = "(a) Incident type", xlabel = "Incident type", labels = ["Rolling\nStock", "Infra-\nstructure"], cases = ["S2_TYPE_ROLLING", "BASELINE"] },
  { caption = "(b) Minimum trip boarding", xlabel = "Minimum trip boarding", labels = ["1", "5"], cases = ["BASELINE", "S2_MTB05"] },
  { caption = "(c) Travel time scaling", xlabel = "Travel time scaling", labels = ["0%", "+20%"], cases = ["BASELINE", "S2_TTP20"] },
  { caption = "(d) Fleet size", xlabel = "Number of buses", labels = ["4", "6"], cases = ["S2_BUS04", "BASELINE"] },
  { caption = "(e) Express route pool", xlabel = "Stops per EXP route", labels = ["3", "3–5"], cases = ["S2_ROUTE_K3", "BASELINE"] },
  { caption = "(f) Out-of-vehicle time weight", xlabel = "Out-of-vehicle time weight", labels = ["1.0", "1.5"], cases = ["BASELINE", "S2_QW150"] },
]

# Fig. 10a/b (Sec. 5.5): support case at a central shared station in the evening window; compares the proposed run
# with paths.stage2_benchmark (fixed centralized benchmark) for each duration realization
[archive.ap_case]
station = "CEN"  # station of the passenger-support case study (empty = skip the case figures)
window = 17  # planning window of the support case
benchmark = "stage2_benchmark"  # paths key of the comparison Stage 2 run in the support case
benchmark_label = "Bus bridging (fixed centralized)"  # legend label of the comparison run in the support case
proposed_label = "Bus bridging (proposed)"  # legend label of the proposed run in the support case

