# Design constants of the synthetic input data set (read by scripts/make_synthetic_inputs.py).
# Every value is invented for a fictitious 12-station, 2-corridor network; none is taken
# from the restricted case-study inputs. File names come from
# config/profiles/synthetic/inputs.toml; windows, duration counts, cutoff, walking time
# and rail capacity come from the synthetic profile.

seed = 20261118

[output]
document_timestamp = "2026-11-18T00:00:00Z"   # fixed xlsx document date (byte-identical output)

[network]
hub = "HUB"
hub_name = "Hub Terminal"
central = "CEN"
central_name = "Central"
depots = ["HUB", "AA3", "BB3", "AA5"]

[[network.corridors]]
id = "ALPHA"            # track column of corridors.csv and corridor id
label = "Alpha"         # corridor label (corridor_tracks.csv, incident StationCorridor)
line = "LNA"            # rail line code (timetable, stations sheet, local route)
line_name = "Alpha Line"
prefix = "AA"           # station codes AA1..AA5
bearing_deg = 35.0      # direction of the corridor from CEN
trip_base = 8630        # trips 8631..8670 (down odd, up even): regular 8xxx trips; range chosen to
                        # collide with no identifier of the real inputs (release audit)
down_minute = 5         # hourly departure HUB -> AA5 at hh:05
up_minute = 10          # hourly departure AA5 -> HUB at hh:10
peak_up = ["07:35", "08:35"]     # two extra inbound peak trains (departure at AA5)
peak_down = ["16:35", "17:35"]   # two extra outbound peak trains (departure at HUB)

[[network.corridors]]
id = "BETA"
label = "Beta"
line = "LNB"
line_name = "Beta Line"
prefix = "BB"
bearing_deg = -35.0
trip_base = 8920        # trips 8921..8960
down_minute = 35
up_minute = 40
peak_up = ["07:05", "08:05"]
peak_down = ["16:05", "17:05"]

[geometry]
origin_lat = -1.0          # anchor of the fictitious plane: open ocean, no city nearby
origin_lon = -25.0
hub_to_central_km = 8.0
link_km = [10.0, 10.0, 11.0, 10.0, 11.0]   # CEN-X1, X1-X2, ..., X4-X5 (about 60 km per corridor)
link_jitter_km = 1.0
lateral_jitter_km = 1.5
road_detour_factor = 1.3   # road distance = 1.3 x Euclidean distance
road_speed_kmh = 50.0
rail_speed_kmh = 80.0
rail_slack_min = 1.5       # uniform extra run time per link
rail_link_min = [6, 12]    # run time bounds per link [min]

[service]
timetable_date = "2019-08-01"
first_hour = 5             # first regular departure 05:xx
last_departure_hour = 22   # last regular departure 22:xx (all trains finish before 24:00)
dwell_min = 1
origin_delay_s = [20.0, 40.0]   # mean, sd of the departure delay at the first stop
link_delay_sd_s = 25.0
dwell_delay_sd_s = 10.0
delayed_threshold_s = 60
punctual_threshold_s = 300

[demand]
first_hour = 5
last_hour = 23             # same hour range as the real OD file (05-23)
# relative trip production/attraction per station (gravity model)
mass = { HUB = 12.0, CEN = 5.0, AA1 = 3.0, AA2 = 2.2, AA3 = 3.5, AA4 = 1.5, AA5 = 2.8, BB1 = 2.5, BB2 = 1.8, BB3 = 3.2, BB4 = 1.4, BB5 = 2.4 }
mass_jitter = 0.1
decay_min = 40.0           # exp(-rail minutes / decay)
transfer_penalty_min = 5.0
# hourly profiles for hours 05..23 (towards the hub / away from the hub)
profile_inbound = [0.3, 0.9, 2.4, 2.8, 1.6, 0.8, 0.7, 0.7, 0.7, 0.7, 0.8, 0.9, 1.0, 0.9, 0.6, 0.5, 0.4, 0.3, 0.2]
profile_outbound = [0.2, 0.4, 0.6, 0.7, 0.6, 0.6, 0.7, 0.7, 0.7, 0.8, 1.0, 1.9, 2.7, 2.2, 1.2, 0.8, 0.6, 0.4, 0.3]
target_peak_train_load = 460   # passengers on the busiest train (rail capacity 500)

[incidents]
first_date = "2019-08-01"
days = 61
first_incident_id = 910001
central_corridor_label = "Central"    # StationCorridor label of HUB/CEN (same convention as the real file)
event_date_source = "TripDate mode; tie earliest"
peak_hours = [7, 8, 9, 16, 17, 18, 19]
demand_weight_exponent = 0.75   # station sampling weight = (station demand in the hour)^0.75
gt_threshold_min = 10
ge_threshold_min = 20
short_range_min = [11, 29]      # maximum delay of short incidents
long_range_min = [40, 240]      # maximum delay of long incidents (>= 40: Long30 = Long35 = Long40)
log_mu = 3.0
log_sigma = 0.55
rain_effect = 0.3
hour_effect = { "8" = -0.1, "17" = 0.25 }
corridor_effect = { Central = -0.1, Alpha = 0.0, Beta = 0.1 }
n_nonregular = 20               # special-service incidents (not 8xxx): in gt10, never in the cohort
n_nonregular_blank_station = 6  # of which without a station (corridor imputed from the line)
nonregular_max_delay_min = 120
special_trip_prefix = "R"
n_minor = 120                   # incidents with maximum delay <= 10 min (raw registry only)
service_hours = [5, 22]
primary_window_min = 10
max_knock_on = 6
knock_on_every_min = 20
knock_on_decay = 0.6
share_two_primary = 0.2
share_vehicle_id = 0.15
share_status_other = 0.08
daily_rain_threshold_mm = 1.0
vehicle_class_code = "SDU"
vehicle_class_description = "Synthetic diesel unit"
vehicle_category_code = "DMU"
vehicle_category_description = "Diesel multiple unit"

# incident types: category labels of the real registry (top-level taxonomy), invented shares/effects
[[incidents.types]]
root = "Infrastructure"
sub = "Unspecified"
share = 0.25
effect = 0.55

[[incidents.types]]
root = "Rolling Stock"
sub = "Unspecified"
share = 0.25
effect = 0.0

[[incidents.types]]
root = "Obstruction on/near Track"
sub = "Unspecified"
share = 0.20
effect = 0.35

[[incidents.types]]
root = "Excess Loading"
sub = "Unspecified"
share = 0.15
effect = -0.5

[[incidents.types]]
root = "Staff Error"
sub = "Unspecified"
share = 0.15
effect = -0.35

[weather]
location_label = "Synthetic city (HUB proxy)"
start = "2019-06-01T00:00:00"
end = "2019-10-01T23:00:00"
grid_elevation_m = 12.0
temp_mean_c = 10.5
temp_trend_c_per_day = 0.04
temp_diurnal_c = 4.0
temp_noise_c = 0.6
p_wet_wet = 0.7
p_dry_wet = 0.02
rain_shape = 0.8
rain_scale_mm = 1.0
wind_mean_kmh = 14.0
wind_sd_kmh = 7.0
cloud_noise = 0.7          # AR(1) innovation of the latent (logit) cloud cover
